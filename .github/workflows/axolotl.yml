name: Update Profile Axolotl

on:
  schedule:
    # Runs every night at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-axolotl:
    runs-on: ubuntu-latest
    steps:
      - uses: neonjava/git-axolotl@v1
        with:
          view: side
          window: annual
          commit: "true"
          branch: output
