[package]
name = "git-axolotl"
version = "2.0.0"
edition = "2021"
description = "Draw a procedural pixel-art axolotl from a GitHub account contributions and language colors, as a looping GIF for a profile README."
license = "MIT"
repository = "https://github.com/neonjava/git-axolotl"
homepage = "https://neonjava.github.io/git-axolotl/"
readme = "README.md"
keywords = ["github", "profile", "axolotl", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
gif = "0.13"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
