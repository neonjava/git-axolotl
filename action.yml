name: git-axolotl
description: Generate a procedural pixel-art axolotl GIF from your GitHub contributions and language colors.
branding:
  icon: anchor
  color: blue

inputs:
  login:
    description: GitHub account whose Axolotl to draw.
    default: ${{ github.repository_owner }}
  view:
    description: Camera angle, one of side, dive, or top.
    default: side
  window:
    description: Contribution window, one of annual (Jan 1 reset) or rolling (trailing 365 days).
    default: annual
  natural:
    description: Set to 'true' to use natural pink axolotl colors instead of GitHub language colors.
    default: "false"
  output-dir:
    description: Folder, relative to the workspace, that receives axolotl.gif, axolotl.png, and share-card.png.
    default: axolotl
  commit:
    description: Set to 'true' to automatically commit and push the generated images.
    default: "true"
  branch:
    description: Target branch when commit is 'true' (defaults to orphan 'output' branch to prevent main history bloat).
    default: output
  token:
    description: Token for reading public data and pushing to the output branch.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install or build git-axolotl binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repo="${GITHUB_ACTION_REPOSITORY:-neonjava/git-axolotl}"
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)     target="x86_64-unknown-linux-gnu"; ext="tar.gz" ;;
          Linux-ARM64)   target="aarch64-unknown-linux-gnu"; ext="tar.gz" ;;
          macOS-ARM64)   target="aarch64-apple-darwin"; ext="tar.gz" ;;
          macOS-X64)     target="x86_64-apple-darwin"; ext="tar.gz" ;;
          Windows-X64)   target="x86_64-pc-windows-msvc"; ext="zip" ;;
          *)             target=""; ext="" ;;
        esac

        install_dir="$RUNNER_TEMP/git-axolotl-bin"
        mkdir -p "$install_dir"

        if [ -n "$target" ] && gh release download "v$version" --repo "$repo" --dir "$install_dir" \
            --pattern "git-axolotl-$version-$target.$ext" 2>/dev/null; then
          echo "Downloaded pre-built git-axolotl v$version for $target"
          if [ "$ext" = "zip" ]; then
            unzip -q "$install_dir/git-axolotl-$version-$target.zip" -d "$install_dir"
          else
            tar -xzf "$install_dir/git-axolotl-$version-$target.tar.gz" -C "$install_dir"
          fi
          echo "$install_dir/git-axolotl-$version-$target" >> "$GITHUB_PATH"
        else
          echo "No pre-built release asset found; compiling git-axolotl from source..."
          cargo build --release --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
          echo "$GITHUB_ACTION_PATH/target/release" >> "$GITHUB_PATH"
        fi

    - name: Collect the account snapshot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        AXOLOTL_LOGIN: ${{ inputs.login }}
        AXOLOTL_WINDOW: ${{ inputs.window }}
      run: |
        git-axolotl collect "$AXOLOTL_LOGIN" --window "$AXOLOTL_WINDOW" --output "$RUNNER_TEMP/axolotl-snapshot.json"

    - name: Render the Axolotl
      shell: bash
      env:
        AXOLOTL_VIEW: ${{ inputs.view }}
        AXOLOTL_NATURAL: ${{ inputs.natural }}
        AXOLOTL_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        extra_flags=""
        if [ "$AXOLOTL_NATURAL" = "true" ]; then
          extra_flags="--natural"
        fi
        git-axolotl render "$RUNNER_TEMP/axolotl-snapshot.json" \
          --output-dir "$AXOLOTL_OUTPUT_DIR" \
          --view "$AXOLOTL_VIEW" $extra_flags

    - name: Commit and push generated Axolotl assets
      if: inputs.commit == 'true'
      shell: bash
      env:
        AXOLOTL_BRANCH: ${{ inputs.branch }}
        AXOLOTL_OUTPUT_DIR: ${{ inputs.output-dir }}
        AXOLOTL_TOKEN: ${{ inputs.token }}
      run: |
        rm -f "$AXOLOTL_OUTPUT_DIR/preview.html"
        remote_url="https://x-access-token:${AXOLOTL_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        if [ -d .git ] && [ "${GITHUB_REF_NAME:-}" = "$AXOLOTL_BRANCH" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$AXOLOTL_OUTPUT_DIR/axolotl.gif" "$AXOLOTL_OUTPUT_DIR/axolotl.png" "$AXOLOTL_OUTPUT_DIR/share-card.png"
          git diff --cached --quiet || (git commit -m "chore: update Axolotl" && git push "$remote_url" "HEAD:$AXOLOTL_BRANCH")
        else
          # The orphan publish replaces the whole branch, so only ever overwrite a branch this action owns.
          if git ls-remote --exit-code --heads "$remote_url" "refs/heads/$AXOLOTL_BRANCH" > /dev/null 2>&1; then
            guard_dir="$RUNNER_TEMP/axolotl-guard"
            rm -rf "$guard_dir"
            git init -q "$guard_dir"
            git -C "$guard_dir" fetch -q --depth=1 "$remote_url" "refs/heads/$AXOLOTL_BRANCH"
            last_subject=$(git -C "$guard_dir" log -1 --format=%s FETCH_HEAD)
            if [ "$last_subject" != "chore: update Axolotl" ]; then
              echo "::error::Refusing to overwrite branch '$AXOLOTL_BRANCH': it was not created by this action (latest commit: '$last_subject'). Use a dedicated branch, or check out that branch to commit on top of it."
              exit 1
            fi
          fi

          work_dir="$RUNNER_TEMP/axolotl-publish"
          rm -rf "$work_dir"
          mkdir -p "$work_dir/$AXOLOTL_OUTPUT_DIR"
          cp "$AXOLOTL_OUTPUT_DIR/axolotl.gif" "$AXOLOTL_OUTPUT_DIR/axolotl.png" "$AXOLOTL_OUTPUT_DIR/share-card.png" "$work_dir/$AXOLOTL_OUTPUT_DIR/"
          cd "$work_dir"
          git init -q
          git checkout -q --orphan "$AXOLOTL_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$AXOLOTL_OUTPUT_DIR/axolotl.gif" "$AXOLOTL_OUTPUT_DIR/axolotl.png" "$AXOLOTL_OUTPUT_DIR/share-card.png"
          git commit -q -m "chore: update Axolotl"
          git push -f "$remote_url" "$AXOLOTL_BRANCH:$AXOLOTL_BRANCH"
        fi
