<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-axolotl preview</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1, h2 { margin: 0; font-size: 14px; font-weight: 600; }
  header, section { display: grid; gap: 12px; padding: 16px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #f0f6fc; }
  .images { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; }
  img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
</style>
</head>
<body>
<header class="dark"><h1>@demo-user - Adult Axolotl (1800 contributions)</h1></header>
<section class="dark">
<h2>GitHub Dark Mode</h2>
<div class="images">
<figure><img src="axolotl.gif" width="640" height="280" alt="The axolotl swimming"><figcaption>axolotl.gif (Animated 15 FPS)</figcaption></figure>
<figure><img src="axolotl.png" width="640" height="280" alt="The axolotl still"><figcaption>axolotl.png (Static Still)</figcaption></figure>
</div>
</section>
<section class="light">
<h2>GitHub Light Mode</h2>
<div class="images">
<figure><img src="axolotl.gif" width="640" height="280" alt="The axolotl swimming"><figcaption>axolotl.gif (Animated 15 FPS)</figcaption></figure>
<figure><img src="axolotl.png" width="640" height="280" alt="The axolotl still"><figcaption>axolotl.png (Static Still)</figcaption></figure>
</div>
</section>
</body>
</html>
